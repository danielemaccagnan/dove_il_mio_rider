# Codemagic — build iOS NON firmate, da installare con Sideloadly (Apple ID
# gratuito, su Windows, senza Mac).
#
# Tre workflow:
#  - ios-rider    -> app del RIDER (come su Android)
#  - ios-manager  -> app del MANAGER (come su Android)
#  - ios-unsigned -> app combinata (Rider+Manager in una sola), come fallback
#
# Stesso progetto Firebase (trova-il-mio-rider) su tutte: i dati si sincronizzano
# con l'app Android. Dopo il build, scarica l'IPA e firmalo/installalo con
# Sideloadly (puoi usare un Bundle ID diverso per ogni app).

definitions:
  scripts:
    - &pubget
      name: Flutter pub get
      script: flutter pub get
    - &podinstall
      name: Pod install
      script: |
        cd ios
        pod install

workflows:
  ios-rider:
    name: iOS RIDER (unsigned)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - *pubget
      - *podinstall
      - name: Build RIDER (senza firma)
        script: |
          flutter build ios --release --no-codesign --flavor rider -t lib/main_rider.dart
      - name: Crea IPA
        script: |
          cd build/ios/iphoneos
          APP=$(ls -d *.app | head -1)
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r app-rider-unsigned.ipa Payload
    artifacts:
      - build/ios/iphoneos/app-rider-unsigned.ipa

  ios-manager:
    name: iOS MANAGER (unsigned)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - *pubget
      - *podinstall
      - name: Build MANAGER (senza firma)
        script: |
          flutter build ios --release --no-codesign --flavor manager -t lib/main_manager.dart
      - name: Crea IPA
        script: |
          cd build/ios/iphoneos
          APP=$(ls -d *.app | head -1)
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r app-manager-unsigned.ipa Payload
    artifacts:
      - build/ios/iphoneos/app-manager-unsigned.ipa

  ios-unsigned:
    name: iOS combinata (unsigned)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - *pubget
      - *podinstall
      - name: Build combinata (senza firma)
        script: |
          flutter build ios --release --no-codesign
      - name: Crea IPA
        script: |
          cd build/ios/iphoneos
          APP=$(ls -d *.app | head -1)
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r app-unsigned.ipa Payload
    artifacts:
      - build/ios/iphoneos/app-unsigned.ipa
